<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>屏幕键盘</title>
    <style>
      .keyboard {
        padding: 0 12px;
        background-image: url("./key-bg-middle.png");
        background-clip: content-box;
        position: relative;
        background-position: center;
        background-size: 100% 100%;
        background-repeat: no-repeat;
        width: 100px;
        height: 40px;
      }

      .keyboard::before {
        content: "";
        width: 12px;
        height: 100%;
        background-image: url("./key-bg-left.png");
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        background-position: left;
        background-size: 100% 100%;
        background-repeat: no-repeat;
      }

      .keyboard::after {
        content: "";
        width: 12px;
        background-image: url("./key-bg-right.png");
        position: absolute;
        top: 0;
        bottom: 0;
        right: 0;
        background-position: right;
        background-size: 100% 100%;
        background-repeat: no-repeat;
      }
    </style>
  </head>

  <body>
    <div class="keyboard">sss</div>
  </body>
</html>
